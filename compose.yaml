services:
  server:
    build:
      context: .
    ports:
      - 9000:80
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: personificca
      DB_USERNAME: personificca
      DB_PASSWORD: personificca
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: personificca
      POSTGRES_USER: personificca
      POSTGRES_PASSWORD: personificca
    ports:
      - 5432:5432
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
